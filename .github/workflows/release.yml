name: Official Release

run-name: "Translate It! ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, for example v1.21.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Prepare Official Release Draft
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare draft release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: bash scripts/ci/official-release.sh prepare

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.sha }}

      - name: Verify checked out release commit
        env:
          EXPECTED_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            printf 'Checked out commit %s does not match release commit %s.\n' "$actual" "$EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release packages
        run: pnpm run publish

      - name: Assert official browser ZIPs
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chrome_zips=(dist/Publish/Translate-It-v*-for-Chrome.zip)
          firefox_zips=(dist/Publish/Translate-It-v*-for-Firefox.zip)
          [[ ${#chrome_zips[@]} -eq 1 ]] || { printf 'Expected exactly one Chrome ZIP, found %s\n' "${#chrome_zips[@]}" >&2; exit 1; }
          [[ -f ${chrome_zips[0]} ]] || { printf 'Chrome ZIP is not a regular file: %s\n' "${chrome_zips[0]}" >&2; exit 1; }
          [[ ${chrome_zips[0]} == "dist/Publish/Translate-It-${RELEASE_TAG}-for-Chrome.zip" ]] || { printf 'Chrome ZIP does not match %s.\n' "$RELEASE_TAG" >&2; exit 1; }
          [[ ${#firefox_zips[@]} -eq 1 ]] || { printf 'Expected exactly one Firefox ZIP, found %s\n' "${#firefox_zips[@]}" >&2; exit 1; }
          [[ -f ${firefox_zips[0]} ]] || { printf 'Firefox ZIP is not a regular file: %s\n' "${firefox_zips[0]}" >&2; exit 1; }
          [[ ${firefox_zips[0]} == "dist/Publish/Translate-It-${RELEASE_TAG}-for-Firefox.zip" ]] || { printf 'Firefox ZIP does not match %s.\n' "$RELEASE_TAG" >&2; exit 1; }

      - name: Attest release ZIP files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/Publish/Translate-It-${{ steps.prepare.outputs.tag }}-for-Chrome.zip
            dist/Publish/Translate-It-${{ steps.prepare.outputs.tag }}-for-Firefox.zip

      - name: Attach and verify Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
          EXPECTED_SHA: ${{ steps.prepare.outputs.sha }}
          PUBLISH_DIR: dist/Publish
        run: bash scripts/ci/official-release.sh finalize-draft
