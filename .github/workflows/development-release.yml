name: Publish Development Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  qualify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      available: ${{ steps.artifact.outputs.available }}
    steps:
      - name: Find exact run artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          expected="translate-it-development-transport-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          if ! artifact_ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${expected}\" and .expired == false) | .id"); then
            printf 'Failed to list artifacts for source run %s.\n' "$SOURCE_RUN_ID" >&2
            exit 1
          fi

          if [[ -z "$artifact_ids" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t matches <<< "$artifact_ids"
          if (( ${#matches[@]} != 1 )); then
            printf 'Expected one artifact named %s, found %s.\n' "$expected" "${#matches[@]}" >&2
            exit 1
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"

  publish:
    needs: qualify
    if: needs.qualify.outputs.available == 'true'
    concurrency:
      group: ci-development-release
      queue: max
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download validated browser ZIPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: translate-it-development-transport-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/development-artifacts

      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_DIR: ${{ runner.temp }}/development-artifacts
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/ci/publish-development.sh
