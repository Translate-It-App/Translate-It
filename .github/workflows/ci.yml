name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Decide if full CI is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/preflight.sh

  verify:
    name: Lint, Test & Build
    needs: preflight
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JavaScript and Vue
        run: pnpm run lint

      - name: Lint styles
        run: pnpm run lint:styles

      - name: Run tests
        run: pnpm run test:run

      - name: Build Chrome and Firefox
        run: pnpm run build

      - name: Validate builds
        run: pnpm run validate
