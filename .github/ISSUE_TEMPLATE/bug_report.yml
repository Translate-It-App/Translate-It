name: Bug report
description: Report a reproducible problem with Translate It
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce it.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable steps that reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Add the OS/device and browser version if relevant.
      placeholder: e.g. Firefox 143 on Android 16, Edge 140 on Windows 11
  - type: input
    id: version
    attributes:
      label: Translate It version
      placeholder: e.g. 1.19.0
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, URLs, or other useful details if relevant.
